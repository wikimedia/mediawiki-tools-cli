image-update:
    stage: test
    image: golang:1.26.1
    cache: {}
    before_script:
      - apt update
      - apt -y install git
      # The child pipeline inherits the `scheduled` ref. Base updates on the
      # latest default-branch commit so their merge requests target current code.
      - |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --unshallow origin "$CI_DEFAULT_BRANCH"
        else
          git fetch origin "$CI_DEFAULT_BRANCH"
        fi
      - git checkout --detach FETCH_HEAD
    script:
      - echo ${COMMAND}
      - ${COMMAND}
      - git diff
      - bash tools/image-update/push.sh "https://project_16_bot:${TOKEN_IMAGE_UPDATE_CI}@gitlab.wikimedia.org/repos/releng/cli.git"
    parallel:
      matrix:
# This MUST remain the end of the file and MUST have a newline below it.
# As the matrix is generated from a job and appended to the file (for ease), rather than YAML parsing etc.
