variables:
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - test
  - build
  - integration
  - release

# Keep Go modules and compilation results inside the checkout so Runner can cache
# them. Separate job keys avoid parallel jobs overwriting each other's caches.
.go-job:
    image: golang:1.26.1
    tags:
      - wmcs
    variables:
      GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
      GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
      GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
      CACHE_COMPRESSION_FORMAT: tarzstd
      CACHE_COMPRESSION_LEVEL: fastest
    cache:
      key: "go1.26.1-$CI_JOB_NAME_SLUG"
      paths:
        - .cache/go-build/
        - .cache/go-mod/
        - .cache/golangci-lint/

.docker-job:
    image: docker:26.1.1
    tags:
      - mwcli
    services:
      - name: docker:26.1.1-dind
    cache: []
    before_script:
      # gcompat runs the glibc-linked mw binary in Alpine.
      - apk add --no-cache libc6-compat bash curl tar git docker-compose

test:
    extends: .go-job
    stage: test
    needs: []
    coverage: '/Total coverage: \d+.\d+%/'
    artifacts:
      when: always
      expire_in: 2 weeks
      paths:
        - coverage.txt
        - coverage.xml
        - junit.xml
      reports:
        junit: junit.xml
        coverage_report: 
          coverage_format: cobertura
          path: coverage.xml
    script:
      - make test

checks:
    extends: .go-job
    stage: test
    needs: []
    parallel:
      matrix:
        - CHECK: lint
        - CHECK: linti
        - CHECK: vet
        - CHECK: git-state
    script:
      - make $CHECK

tools:
    extends: .go-job
    stage: test
    needs: []
    parallel:
      matrix:
        - TOOL: ./tools/image-update/check/check.go
        - TOOL: ./tools/image-update/update/update.go foo bar
        # docs-gen tool is tested as docs are generated
        # lint tool is checked as linting is run
    script:
      - go run $TOOL

build:
    extends: .go-job
    stage: build
    needs: []
    artifacts:
      paths:
        - bin/
    script:
      - make build

# Basic command tests need the binary, but neither Docker nor MediaWiki.
integration-cli:
    stage: integration
    image: golang:1.26.1
    tags:
      - wmcs
    cache: []
    needs:
      - job: build
    parallel:
      matrix:
        - TEST_SCRIPT: test-general.sh
        - TEST_SCRIPT: test-general-online.sh
    script:
      - ./tests/$TEST_SCRIPT

# Prepare once per pipeline. Cache one archive locally between pipelines and use
# an artifact to distribute the same clean snapshot across both Docker runners.
prepare-mediawiki:
    extends: .docker-job
    stage: build
    needs: []
    cache:
      key:
        prefix: mediawiki-snapshot-v1
        files:
          - tests/cache-mediawiki.sh
          - tests/prepare-mediawiki.sh
      paths:
        - .cache/mediawiki.tar.gz
    artifacts:
      expire_in: 1 day
      paths:
        - .cache/mediawiki.tar.gz
    script:
      - bash tests/prepare-mediawiki.sh

integration-get-code:
    extends: .docker-job
    stage: integration
    needs: [checks,test,build]
    script:
      - ./tests/test-docker-get-code.sh

integration:
    extends: .docker-job
    stage: integration
    needs:
      - job: checks
        artifacts: false
      - job: test
        artifacts: false
      - job: build
      - job: prepare-mediawiki
    parallel:
      matrix:
        - TEST_SCRIPT: test-docker-general.sh
        - TEST_SCRIPT: test-docker-mw-all-dbs.sh
        - TEST_SCRIPT: test-docker-mw-mysql-cycle.sh
        - TEST_SCRIPT: test-docker-recipe-repoclient.sh
    script:
      - tar -xzf .cache/mediawiki.tar.gz
      - ./tests/$TEST_SCRIPT

build-release:
    extends: .go-job
    except:
      - tags
    stage: release
    needs: [checks,test,build]
    # Exposed so that non-tag pipelines can be used to hand out per-OS/arch builds for testing
    artifacts:
      expire_in: 2 weeks
      paths:
        - _release/
    script:
      - make release VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}

build-docs:
    extends: .go-job
    except:
      - tags
    stage: release
    needs: [build,integration-cli,integration-get-code,integration]
    before_script:
      - apt update
      - apt -y install pandoc
    script:
      - make docs

release-build:
    extends: .go-job
    only:
      - tags
    stage: release
    needs: [build,integration-cli,integration-get-code,integration]
    artifacts:
      paths:
        - _release/
    script:
      - make release VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}

release-upload:
  only:
    - tags
  stage: release
  needs: [release-build]
  dependencies:
    - release-build
  image: ubuntu:latest
  tags:
  - wmcs
  before_script:
    - apt update
    - apt -y install curl
  # https://docs.gitlab.com/ee/user/packages/generic_packages/#publish-a-generic-package-by-using-cicd
  script:
    - echo "Placeholder job, as a conditional upload currently happens as part of release-build awaiting decision on https://phabricator.wikimedia.org/T292372"
    - >
      for release_path in  $(find ./_release -type f); do
        release_file=$(echo $release_path | sed "s/.*\///")
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ${release_path} "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mwcli/${CI_COMMIT_TAG}/${release_file}"
      done

release-publish:
  only:
    - tags
  stage: release
  needs: [release-upload,release-build]
  dependencies:
    - release-build
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
  - wmcs
  script:
    - (echo "## ${CI_COMMIT_TAG}" && echo "CHANGELOG extracted from https://gitlab.wikimedia.org/repos/releng/cli/-/blob/main/CHANGELOG.md" && sed "/^## ${CI_COMMIT_TAG}$/,/^## /"'!d'";//d;/\^$/d" CHANGELOG.md) > .gitlab.description.md
    - assets_links=""
    - >
      for release_path in  $(find ./_release -type f); do
        release_file=$(echo $release_path | sed "s/.*\///")
        assets_links="${assets_links} --assets-link {\"name\":\"${release_file}\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mwcli/${CI_COMMIT_TAG}/${release_file}\"}"
      done
    - release-cli create --name "Release $CI_COMMIT_TAG" --description ".gitlab.description.md" --released-at "${CI_COMMIT_TIMESTAMP}" ${assets_links}

release-docs:
    only:
      - tags
    stage: release
    needs: [release-publish]
    cache: {}
    image: golang:1.26.1
    tags:
    - wmcs
    before_script:
      - apt update
      - apt -y install pandoc
    script:
      - make docs
      - make user="$DOCS_UPDATE_USER" password="$DOCS_UPDATE_PASS" docs-publish
