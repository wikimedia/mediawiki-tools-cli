# Keep job eligibility unchanged: selection happens at include time.
# These guards must match check-ci-selection.sh.
include:
  - local: ".gitlab/pipelines/integration.yml"
    rules:
      - &full-ci
        if: '$CI_COMMIT_TAG || $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true" || $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true" || $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result" || $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" || $CI_COMMIT_MESSAGE_IS_TRUNCATED == "true"'
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Skip:[ \t]*integration[ \t]*\r?$/'
        when: never
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:[ \t]*integration[ \t]*\r?$/'
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:/'
        when: never
      - when: always
  - local: ".gitlab/pipelines/preview-release.yml"
    rules:
      - *full-ci
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Skip:[ \t]*preview-release[ \t]*\r?$/'
        when: never
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:[ \t]*preview-release[ \t]*\r?$/'
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:/'
        when: never
      - when: always
  - local: ".gitlab/pipelines/docs.yml"
    rules:
      - *full-ci
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Skip:[ \t]*docs[ \t]*\r?$/'
        when: never
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:[ \t]*docs[ \t]*\r?$/'
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:/'
        when: never
      - when: always
  - local: ".gitlab/pipelines/tools.yml"
    rules:
      - *full-ci
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Skip:[ \t]*tools[ \t]*\r?$/'
        when: never
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:[ \t]*tools[ \t]*\r?$/'
      - if: '$CI_COMMIT_MESSAGE =~ /(?m)^CI-Only:/'
        when: never
      - when: always

variables:
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - test
  - build
  - integration
  - release

# The plan would be for this cache to be reused by all jobs.
# Caches currently end up cached per runner, per job concurrency level and per md5 of path?
# So there are lots of duplicate caches that end up needing to be populated right now?
# https://forum.gitlab.com/t/confusion-around-ci-docker-cache-volumes-and-sharing-across-jobs-concurrency/56793
# Docker cache volumes look like this runner-<short-token>-project-<id>-concurrent-<concurrency-id>-cache-<md5-of-path>
cache:
  - key: mediawiki
    paths:
      - .mediawiki

test:
    stage: test
    needs: []
    cache: {}
    image: golang:1.26.1
    tags:
    - wmcs
    coverage: '/Total coverage: \d+.\d+%/'
    artifacts:
      when: always
      expire_in: 2 weeks
      paths:
        - coverage.txt
        - coverage.xml
        - junit.xml
      reports:
        junit: junit.xml
        coverage_report: 
          coverage_format: cobertura
          path: coverage.xml
    before_script:
      - go install github.com/bwplotka/bingo@v0.9.0
      - bingo get
    script:
      - sh .gitlab/check-ci-selection.sh
      - make test

checks:
    stage: test
    needs: []
    cache: {}
    image: golang:1.26.1
    tags:
    - wmcs
    parallel:
      matrix:
        - CHECK: lint
        - CHECK: linti
        - CHECK: vet
        - CHECK: git-state
    before_script:
      - go install github.com/bwplotka/bingo@v0.9.0
      - bingo get
    script:
      # XDG_CACHE_HOME was needed by staticcheck
      - export XDG_CACHE_HOME=/tmp/mwcli-cache
      - make $CHECK

build:
    stage: build
    needs: []
    cache: {}
    image: golang:1.26.1
    tags:
    - wmcs
    artifacts:
      paths:
        - bin/
    before_script:
      - go install github.com/bwplotka/bingo@v0.9.0
      - bingo get
    script:
      - make build

release-build:
    only:
      - tags
    stage: release
    # Integration is always included on tags; optional also permits validation
    # of branch configurations where that group is omitted.
    needs:
      - checks
      - test
      - build
      - job: integration
        optional: true
    cache: {}
    image: golang:1.26.1
    tags:
    - wmcs
    artifacts:
      paths:
        - _release/
    before_script:
      - go install github.com/bwplotka/bingo@v0.9.0
      - bingo get
    script:
      - make release VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}

release-upload:
  only:
    - tags
  stage: release
  needs: [release-build]
  dependencies:
    - release-build
  image: ubuntu:latest
  tags:
  - wmcs
  before_script:
    - apt update
    - apt -y install curl
  # https://docs.gitlab.com/ee/user/packages/generic_packages/#publish-a-generic-package-by-using-cicd
  script:
    - echo "Placeholder job, as a conditional upload currently happens as part of release-build awaiting decision on https://phabricator.wikimedia.org/T292372"
    - >
      for release_path in  $(find ./_release -type f); do
        release_file=$(echo $release_path | sed "s/.*\///")
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ${release_path} "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mwcli/${CI_COMMIT_TAG}/${release_file}"
      done

release-publish:
  only:
    - tags
  stage: release
  needs: [release-upload,release-build]
  dependencies:
    - release-build
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
  - wmcs
  script:
    - (echo "## ${CI_COMMIT_TAG}" && echo "CHANGELOG extracted from https://gitlab.wikimedia.org/repos/releng/cli/-/blob/main/CHANGELOG.md" && sed "/^## ${CI_COMMIT_TAG}$/,/^## /"'!d'";//d;/\^$/d" CHANGELOG.md) > .gitlab.description.md
    - assets_links=""
    - >
      for release_path in  $(find ./_release -type f); do
        release_file=$(echo $release_path | sed "s/.*\///")
        assets_links="${assets_links} --assets-link {\"name\":\"${release_file}\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mwcli/${CI_COMMIT_TAG}/${release_file}\"}"
      done
    - release-cli create --name "Release $CI_COMMIT_TAG" --description ".gitlab.description.md" --released-at "${CI_COMMIT_TIMESTAMP}" ${assets_links}

release-docs:
    only:
      - tags
    stage: release
    needs: [release-publish]
    cache: {}
    image: golang:1.26.1
    tags:
    - wmcs
    before_script:
      - apt update
      - apt -y install pandoc
    script:
      - make docs
      - make user="$DOCS_UPDATE_USER" password="$DOCS_UPDATE_PASS" docs-publish
