# Called once per test. Reporting gets a fresh VM; the test gets no callback token.
name: Integration test

on:
  workflow_call:
    inputs:
      platform:
        default: linux-amd64
        type: string
      test:
        required: true
        type: string
      artifact:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      request_job_id:
        required: true
        type: string
    secrets:
      GITLAB_STATUS_TOKEN:
        required: true

permissions: {}

env:
  GITHUB_INTEGRATION_REPOSITORY: wikimedia/mediawiki-tools-cli

jobs:
  test:
    name: Test
    runs-on: ${{ fromJSON('{"linux-amd64":"ubuntu-24.04","windows-amd64":"windows-2025","macos-arm64":"macos-15","linux-arm64":"ubuntu-24.04-arm"}')[inputs.platform] }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.platform == 'linux-amd64' && inputs.artifact || format('{0}-source', inputs.artifact) }}
          path: inputs
      - name: Provide the Docker Compose command used by the tests
        if: inputs.platform == 'linux-amd64'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker compose "$@"\n' > "$RUNNER_TEMP/bin/docker-compose"
          chmod +x "$RUNNER_TEMP/bin/docker-compose"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test with the GitHub host Docker daemon
        if: inputs.platform == 'linux-amd64'
        env:
          TEST: ${{ inputs.test }}
        run: python3 tools/ci/run-github-integration.py "$TEST"

      - name: Check out the exact GitLab source bundle
        if: inputs.platform != 'linux-amd64'
        shell: bash
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          mkdir source
          git -C source init -q
          git -C source fetch -q "$GITHUB_WORKSPACE/inputs/source.bundle" HEAD
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-go@v6
        if: inputs.platform != 'linux-amd64'
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Build the native CLI
        if: inputs.platform != 'linux-amd64'
        shell: bash
        working-directory: source
        run: |
          binary=bin/mw
          if [[ "$RUNNER_OS" == Windows ]]; then binary=bin/mw.exe; fi
          mkdir -p bin
          go build -o "$binary" .
      - name: Run the selected native test
        if: inputs.platform != 'linux-amd64'
        shell: bash
        working-directory: source
        env:
          TEST_NAME: ${{ inputs.test }}
          MWCLI_CONTEXT_TEST: '1'
        run: |
          [[ "$TEST_NAME" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
          bash "tests/test-$TEST_NAME.sh"

  report:
    name: Report result
    needs: test
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish this test's result and log link immediately
        env:
          GITLAB_STATUS_TOKEN: ${{ secrets.GITLAB_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_JOB_ID: ${{ inputs.request_job_id }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          TEST_NAME: ${{ inputs.platform == 'linux-amd64' && inputs.test || format('{0}/{1}', inputs.platform, inputs.test) }}
        run: python3 .github/scripts/gitlab-native.py report-test
