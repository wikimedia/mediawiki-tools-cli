name: Sync from GitLab

on:
#   schedule:
#     # Every 15 minutes
#     - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-gitlab-main
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch GitLab main
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          gitlab_url=$(PYTHONPATH=tools/ci python3 -c 'from github_status import GitLab; print(GitLab().project_clone_url())')
          if [[ -n "$GITLAB_TOKEN" ]]; then
            gitlab_url="https://oauth2:${GITLAB_TOKEN}@${gitlab_url#https://}"
          fi
          git fetch "$gitlab_url" main

      - name: Sync GitHub main to GitLab main
        shell: bash
        run: |
          git checkout main
          git reset --hard FETCH_HEAD

          if git push origin main --force-with-lease; then
            echo "GitHub main synchronized with GitLab main"
          else
            echo "Push with --force-with-lease failed (branch moved), retrying once"
            git fetch origin main
            git push origin main --force-with-lease
          fi
