name: GitLab CI queue

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GitLab project ID
        default: '16'
        type: string
      job_id:
        description: GitLab job ID (empty checks the pending queue)
        type: string
      job_status:
        description: GitLab job status
        default: pending
        type: string

permissions: {}

jobs:
  queue:
    if: >-
      github.repository == 'wikimedia/mediawiki-tools-cli' &&
      github.ref == 'refs/heads/main' &&
      vars.GITLAB_WORKERS_ENABLED == 'true' &&
      inputs.project_id == '16' && inputs.job_status == 'pending'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check for pending dind jobs
        id: check
        env:
          GITLAB_API_READ_TOKEN: ${{ secrets.GITLAB_API_READ_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: python3 .github/scripts/gitlab-queue.py

      - name: Cancel when no worker is needed
        if: steps.check.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          # Keep this job running while GitHub processes the cancellation.
          sleep 30

      - name: Start a worker for the pending job
        if: steps.check.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ steps.check.outputs.job_id }}
        run: |
          gh workflow run gitlab-worker.yml --ref main \
            --repo "$GITHUB_REPOSITORY" --field job_id="$JOB_ID"
