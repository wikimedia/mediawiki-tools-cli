# set appsec-related template variables
variables:
    WM_APPSEC_GOLANG_IMAGE: "bookworm:20251109"
    AST_ENABLE_MR_PIPELINES: "true"
    # Trial only: the production branch keeps native integration disabled.
    GITHUB_NATIVE_INTEGRATION: "1"
    GITHUB_INTEGRATION_REPOSITORY: "addshore/testing"
    GITHUB_STATUS_BOT_ID: "3072"

default:
  interruptible: true

# Feature branches need an MR (drafts included). Never create a second push
# pipeline for the same feature commit.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $GITLAB_SCHEDULE == "weekly"'
      auto_cancel:
        on_new_commit: none
    - when: never

include:
- local: ".gitlab/pipelines/commit.yml"
  rules:
  - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'push'"
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
- template: Security/Secret-Detection.gitlab-ci.yml
  rules:
  - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'push'"
- template: Security/SAST.gitlab-ci.yml
  rules:
  - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'push'"
- local: ".gitlab/pipelines/weekly.yml"
  rules:
  - if: "$CI_PIPELINE_SOURCE == 'schedule' && $GITLAB_SCHEDULE == 'weekly'"
