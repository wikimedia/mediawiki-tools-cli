
services:
  adminer:
    image: "${ADMINER_IMAGE:-adminer:6.1.2}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer-host.rule=Host(`${ADMINER_VIRTUAL_HOST:-adminer.local.wmftest.net}`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.adminer-host.entrypoints=web"
      - "traefik.http.routers.adminer-host.service=adminer"
      - "traefik.http.routers.adminer.rule=Path(`/proxy/${ADMINER_PROXY_PATH:-adminer}`) || PathPrefix(`/proxy/${ADMINER_PROXY_PATH:-adminer}/`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.middlewares=forwarded-https@file,strip-adminer@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-adminer.stripprefix.prefixes=/proxy/${ADMINER_PROXY_PATH:-adminer}"
      - "traefik.http.services.adminer.loadbalancer.server.port=${ADMINER_VIRTUAL_PORT:-8080}"
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${ADMINER_VIRTUAL_HOST:-adminer.local.wmftest.net}
      - VIRTUAL_PORT=${ADMINER_VIRTUAL_PORT:-8080}
      - DEFAULT_EXPOSE_PORT=8080
    depends_on:
      - dps
      - traefik
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
