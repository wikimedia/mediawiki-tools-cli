
services:

  mediawiki:
    image: "${MEDIAWIKI_IMAGE:-docker-registry.wikimedia.org/dev/bookworm-php83-fpm:1.0.0}"
    security_opt:
      - label:disable
    restart: unless-stopped
    entrypoint: "/mwdd/entrypoint.sh"
    volumes:
      - ./compose/mediawiki/mount/wait-for-it.sh:/wait-for-it.sh:ro
      - ./compose/mediawiki/mount/mediawiki:/mwdd:ro
      - "${MEDIAWIKI_VOLUMES_CODE}:/var/www/html/w:cached"
      - "${MEDIAWIKI_VOLUMES_DATA:-mediawiki-data}:/var/www/html/w/cache/docker:delegated"
      - "${MEDIAWIKI_VOLUMES_IMAGES:-mediawiki-images}:/var/www/html/w/images/docker:delegated"
      - "${MEDIAWIKI_VOLUMES_LOGS:-mediawiki-logs}:/var/log/mediawiki:delegated"
      - "${MEDIAWIKI_VOLUMES_DOT_COMPOSER:-mediawiki-dot-composer}:/.composer:delegated"
    environment:
      - MW_DB_DEFAULT=${MEDIAWIKI_DEFAULT_DBNAME:-default}
      - MW_DB_DEFAULT_HOSTS=${MEDIAWIKI_DEFAULT_HOSTS:-}
      - MW_DB_DEFAULT_HTTPS_HOSTS=${MEDIAWIKI_DEFAULT_HTTPS_HOSTS:-}
      # MW_INSTALL_PATH is used by various maintenance scripts to find MediaWiki.
      # Also required for /var/www/index.php - https://phabricator.wikimedia.org/T153882
      - MW_INSTALL_PATH=/var/www/html/w
      - COMPOSER_CACHE_DIR=/.composer/cache
      - XDEBUG_CONFIG=${MEDIAWIKI_XDEBUG_CONFIG:-client_host=xdebug://gateway}
      - XDEBUG_MODE=${MEDIAWIKI_XDEBUG_MODE:-debug}
      - XDG_CONFIG_HOME=/var/www/html/w/cache/docker
      - SHELLBOX_SECRET_KEY=${SHELLBOX_SECRET_KEY}
    depends_on:
      - mediawiki-web
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

  mediawiki-web:
    image: "${MEDIAWIKI_WEB_IMAGE:-docker-registry.wikimedia.org/dev/bookworm-apache2:1.0.1}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wiki.rule=PathPrefix(`/proxy/`)"
      - "traefik.http.routers.wiki.priority=10"
      - "traefik.http.routers.wiki.entrypoints=web"
      - "traefik.http.routers.wiki.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},wiki-prefix@file,forwarded-https@file"
      - "traefik.http.services.wiki.loadbalancer.server.port=${MEDIAWIKI_VIRTUAL_PORT:-8080}"
      - "traefik.http.routers.wiki-local.rule=HostRegexp(`^[a-z0-9-]+\\.mediawiki\\.local\\.wmftest\\.net$`) && PathPrefix(`/`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.wiki-local.priority=5"
      - "traefik.http.routers.wiki-local.entrypoints=web"
      - "traefik.http.routers.wiki-local.service=wiki"
      - "traefik.http.routers.wiki-host.rule=PathPrefix(`/`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.wiki-host.priority=1"
      - "traefik.http.routers.wiki-host.entrypoints=web"
      - "traefik.http.routers.wiki-host.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file}"
      - "traefik.http.routers.wiki-host.service=wiki"
    security_opt:
      - label:disable
    restart: unless-stopped
    volumes:
      - "${MEDIAWIKI_VOLUMES_CODE}:/var/www/html/w:cached"
      - "${MEDIAWIKI_VOLUMES_DATA:-mediawiki-data}:/var/www/html/w/cache/docker:delegated"
      - "${MEDIAWIKI_VOLUMES_IMAGES:-mediawiki-images}:/var/www/html/w/images/docker:delegated"
    environment:
      - VIRTUAL_HOST=${MEDIAWIKI_VIRTUAL_HOSTS:-*.mediawiki.local.wmftest.net}
      - VIRTUAL_PORT=${MEDIAWIKI_VIRTUAL_PORT:-8080}
      - DEFAULT_EXPOSE_PORT=8080
    depends_on:
      - traefik
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

volumes:
  mediawiki-data:
  mediawiki-images:
  mediawiki-logs:
  mediawiki-dot-composer:
