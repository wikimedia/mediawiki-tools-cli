http:
  middlewares:
    gateway-auth:
      basicAuth:
        usersFile: /etc/traefik/auth/users
    dashboard-prefix:
      stripPrefix:
        prefixes:
          - /proxy/dashboard
    wiki-prefix:
      stripPrefixRegex:
        regex:
          - "^/proxy/[^/]+"
    forwarded-https:
      # Keep the middleware name for existing service labels. Traefik preserves
      # HTTPS forwarded by Cloudflare/public proxies and uses HTTP for a local
      # Holesail client. Forcing HTTPS here breaks local links and redirects.
      chain:
        middlewares: []
