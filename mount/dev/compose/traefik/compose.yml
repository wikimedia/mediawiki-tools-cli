services:
  traefik:
    image: "${TRAEFIK_IMAGE:-traefik:v3.6.16}"
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=${TRAEFIK_DOCKER_API_VERSION:-1.44}
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedheaders.insecure=true
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=120s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=120s
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_DOCKER_NETWORK}
      - --providers.docker.constraints=Label(`com.docker.compose.project`, `${TRAEFIK_DOCKER_PROJECT}`)
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=false
    ports:
      - "${TRAEFIK_BIND_ADDR:-0.0.0.0}:${PORT}:80"
    volumes:
      - ./compose/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./compose/traefik/auth:/etc/traefik/auth:ro
    depends_on:
      - dps
      - docker-socket-proxy
    networks:
      - dps
      - gateway-control

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway-control

networks:
  gateway-control:
    internal: true
