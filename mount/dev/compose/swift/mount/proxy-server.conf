# As operations/puppet: modules/swift/templates/proxy-server.conf.erb, with
# the pipeline of modules/swift/manifests/proxy.pp for the media clusters
# (enable_wmf_filters). Not copied: statsd, read affinity, and the s3api
# filters, which that pipeline does not have.
[DEFAULT]
bind_port = 8080
workers = 2
user = swift

[pipeline:main]
pipeline = proxy-logging listing_formats ensure_max_age rewrite healthcheck cache container_sync tempurl ratelimit tempauth cors proxy-logging proxy-server

[app:proxy-server]
use = egg:swift#proxy
account_autocreate = true

[filter:tempurl]
use = egg:swift#tempurl
# default includes PUT
methods = GET HEAD

# The accounts of production (hieradata/common/profile/swift.yaml): the user
# of MediaWiki is an admin of the account, and the two users of Thumbor have
# only what the ACL of a container gives them. The keys are for development.
[filter:tempauth]
use = egg:swift#tempauth
token_life = 604800
user_mw_media = @SWIFT_MEDIA_KEY@ .admin http://swift:8080/v1/AUTH_mw
user_mw_thumbor = @SWIFT_THUMBOR_KEY@ http://swift:8080/v1/AUTH_mw
user_mw_thumbor-private = @SWIFT_PRIVATE_KEY@ http://swift:8080/v1/AUTH_mw

[filter:ratelimit]
use = egg:swift#ratelimit
# accounts limited to 5/s PUT/DELETE to containers
account_ratelimit = 5
account_whitelist = AUTH_mw,AUTH_docker
log_sleep_time_seconds = 3
# containers with > 200 objects limited to 30/s PUT/DELETE/POST and listings
container_ratelimit_200 = 30
container_listing_ratelimit_200 = 30

[filter:container_sync]
use = egg:swift#container_sync

[filter:healthcheck]
use = egg:swift#healthcheck

# memcached runs in this container (start.sh).
[filter:cache]
use = egg:swift#memcache
memcache_servers = 127.0.0.1:11211
memcache_serialization_support = 2
memcache_max_connections = 12

[filter:proxy-logging]
use = egg:swift#proxy_logging

[filter:listing_formats]
use = egg:swift#listing_formats

[filter:cors]
paste.filter_factory = wmf.cors:filter_factory

[filter:ensure_max_age]
paste.filter_factory = wmf.ensure_max_age:filter_factory
methods_list = HEAD GET
status_list = 200
max_age = 86400
host_list = @SWIFT_UPLOAD_HOST@

[filter:rewrite]
account = AUTH_mw
user_agent = Mozilla/5.0
# Must match MediaWiki and Thumbor sharding configuration.
shard_container_list = @SWIFT_SHARDED_CONTAINERS@
# sending thumbnail requests to thumbor
thumborhost = thumbor:8800
inactivedc_thumborhost = thumbor:8800
paste.filter_factory = wmf.rewrite:filter_factory
