# As operations/puppet: modules/swift/templates/object-server.conf.erb. The
# allowed_headers list is production's: it says which request headers the
# object server keeps with an object.
[DEFAULT]
bind_ip = 127.0.0.1
bind_port = 6200
workers = 1
user = swift
devices = /srv/node
mount_check = false

[pipeline:main]
pipeline = object-server

[app:object-server]
use = egg:swift#object
allowed_headers = content-disposition,
	content-encoding,
	x-delete-at,
	x-object-manifest,
	x-static-large-object,
	x-content-duration,
	x-content-dimensions
