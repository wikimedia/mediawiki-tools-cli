
# https://www.mediawiki.org/wiki/MediaWiki-Docker/Configuration_recipes/EventGate
services:
  eventlogging:
    # https://docker-registry.wikimedia.org/wikimedia/eventgate-wikimedia/tags/
    image: "${EVENTLOGGING_IMAGE:-docker-registry.wikimedia.org/repos/data-engineering/eventgate-wikimedia:v1.33.0}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eventlogging-host.rule=Host(`${EVENTLOGGING_VIRTUAL_HOST:-eventlogging.local.wmftest.net}`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.eventlogging-host.entrypoints=web"
      - "traefik.http.routers.eventlogging-host.service=eventlogging"
      - "traefik.http.routers.eventlogging.rule=Path(`/proxy/${EVENTLOGGING_PROXY_PATH:-eventlogging}`) || PathPrefix(`/proxy/${EVENTLOGGING_PROXY_PATH:-eventlogging}/`)"
      - "traefik.http.routers.eventlogging.entrypoints=web"
      - "traefik.http.routers.eventlogging.middlewares=forwarded-https@file,strip-eventlogging@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-eventlogging.stripprefix.prefixes=/proxy/${EVENTLOGGING_PROXY_PATH:-eventlogging}"
      - "traefik.http.services.eventlogging.loadbalancer.server.port=${EVENTLOGGING_VIRTUAL_PORT:-8192}"
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${EVENTLOGGING_VIRTUAL_HOST:-eventlogging.local.wmftest.net}
      - VIRTUAL_PORT=${EVENTLOGGING_VIRTUAL_PORT:-8192}
    entrypoint: [/srv/service/node_modules/.bin/eventgate, -c, config.dev.yaml]
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
