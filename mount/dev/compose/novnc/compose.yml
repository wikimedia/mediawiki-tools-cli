services:
  novnc:
    image: "${NOVNC_IMAGE:-ghcr.io/montehurd/mediawiki-docker-images/novnc@sha256:57358bd7ab04bf4b39405369cc8e896bb5571251edd97671d8d6227b639bd2e1}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.novnc.rule=Path(`/proxy/${NOVNC_PROXY_PATH:-novnc}`) || PathPrefix(`/proxy/${NOVNC_PROXY_PATH:-novnc}/`)"
      - "traefik.http.routers.novnc.entrypoints=web"
      - "traefik.http.routers.novnc.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},strip-novnc@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-novnc.stripprefix.prefixes=/proxy/${NOVNC_PROXY_PATH:-novnc}"
      - "traefik.http.services.novnc.loadbalancer.server.port=${NOVNC_VIRTUAL_PORT:-8086}"
    restart: unless-stopped
    environment:
      - NOVNC_PORT=8086
      - VIRTUAL_HOST=${NOVNC_VIRTUAL_HOST:-novnc.local.wmftest.net}
      - VIRTUAL_PORT=${NOVNC_VIRTUAL_PORT:-8086}
      - DEFAULT_EXPOSE_PORT=8086
    depends_on:
      - nginx-proxy
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
