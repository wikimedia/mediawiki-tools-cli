# This file is provided by the wikibase/wdqs-frontend docker image.
server {
    listen       80;
    server_name  localhost;

    location /proxy/wikibase {
        rewrite /proxy/wikibase/(.*) /${DOLLAR}1 break;
        proxy_pass http://mediawiki-web:$WIKIBASE_PORT;
        proxy_set_header Host $WIKIBASE_HOST;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Host "";
    }

    location /proxy/wdqs {
        rewrite /proxy/wdqs/(.*) /${DOLLAR}1 break;
        proxy_pass http://$WDQS_HOST:80;
    }

    # The frontend requests this development path when accessed on localhost.
    location /node_modules/jquery.uls/i18n/ {
        alias /usr/share/nginx/html/i18n/;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
