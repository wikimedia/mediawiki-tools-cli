---
services:
  wdqs-ui:
    image: "wikibase/wdqs-frontend:wmde.11"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wdqs-ui-host.rule=Host(`${WDQS_UI_VIRTUAL_HOST:-wdqs-ui.local.wmftest.net}`)"
      - "traefik.http.routers.wdqs-ui-host.priority=100"
      - "traefik.http.routers.wdqs-ui-host.entrypoints=web"
      - "traefik.http.routers.wdqs-ui-host.service=wdqs-ui"
      - "traefik.http.routers.wdqs-ui.rule=Path(`/proxy/${WDQS_UI_PROXY_PATH:-wdqs-ui}`) || PathPrefix(`/proxy/${WDQS_UI_PROXY_PATH:-wdqs-ui}/`)"
      - "traefik.http.routers.wdqs-ui.entrypoints=web"
      - "traefik.http.routers.wdqs-ui.middlewares=forwarded-https@file,strip-wdqs-ui@docker"
      - "traefik.http.middlewares.strip-wdqs-ui.stripprefix.prefixes=/proxy/${WDQS_UI_PROXY_PATH:-wdqs-ui}"
      - "traefik.http.services.wdqs-ui.loadbalancer.server.port=${WDQS_UI_VIRTUAL_PORT:-80}"
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${WDQS_UI_VIRTUAL_HOST:-wdqs-ui.local.wmftest.net}
      - DEFAULT_EXPOSE_PORT=80
      - WIKIBASE_HOST=default.mediawiki.local.wmftest.net
      - WIKIBASE_PORT=${MEDIAWIKI_VIRTUAL_PORT:-8080}
      - WDQS_HOST=wdqs-proxy
    volumes:
      - ./compose/wdqs-ui/mount/custom-config.json:/templates/custom-config.json:ro
      - ./compose/wdqs-ui/mount/default.conf:/templates/default.conf:ro
    depends_on:
      - mediawiki
      - dps
      - traefik
      - wdqs-proxy
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
