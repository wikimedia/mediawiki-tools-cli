input {
  file {
    id => "mediawiki-files"
    path => ["/var/log/mediawiki/**/*.log"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/mediawiki.sincedb"
    add_field => { "service" => "mediawiki" }
  }
}

# Keep the original line searchable even for structured logs. Nest parsed JSON
# so application fields cannot replace collector metadata or the message.
filter {
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "event"
      skip_on_invalid_json => true
    }
  }
}

output {
  opensearch {
    hosts => ["http://logs-opensearch:9200"]
    index => "mwcli-logs-%{+yyyy.MM.dd}"
    template => "/usr/share/logstash/config/mwcli-template.json"
    template_name => "mwcli-logs"
    template_overwrite => true
  }
}
