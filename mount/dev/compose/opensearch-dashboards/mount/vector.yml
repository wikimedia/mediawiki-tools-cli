# Vector reads a COPY of Docker output through the existing GET-only API proxy.
# Docker logging drivers, docker logs and MediaWiki file logging stay unchanged.
data_dir: /var/lib/vector

sources:
  containers:
    type: docker_logs
    docker_host: http://docker-socket-proxy:2375
    include_labels:
      - "com.docker.compose.project=${MWCLI_LOGS_PROJECT}"
  mediawiki_files:
    type: file
    include: ["/var/log/mediawiki/**/*.log"]
    read_from: beginning
    max_line_bytes: 1048576
    file_key: path

transforms:
  # Filter exact service labels, so custom container names work too. Vector
  # also excludes its own container by default.
  context_containers:
    type: filter
    inputs: [containers]
    condition: |
      .label."com.docker.compose.project" == get_env_var!("MWCLI_LOGS_PROJECT") &&
      !includes(["logs-collector", "logs-opensearch", "logs-setup", "opensearch-dashboards"], .label."com.docker.compose.service")
  container_metadata:
    type: remap
    inputs: [context_containers]
    source: |
      .service = .label."com.docker.compose.service"
      .project = .label."com.docker.compose.project"
      .source = "container"
      del(.label)
  file_metadata:
    type: remap
    inputs: [mediawiki_files]
    source: |
      .service = "mediawiki"
      .project = get_env_var!("MWCLI_LOGS_PROJECT")
      .source = "mediawiki_file"
  searchable_logs:
    type: remap
    inputs: [container_metadata, file_metadata]
    source: |
      ."@timestamp" = del(.timestamp)
      .event_id = uuid_v4()

sinks:
  opensearch:
    type: elasticsearch
    inputs: [searchable_logs]
    endpoints: ["http://logs-opensearch:9200"]
    api_version: v7
    suppress_type_name: true
    mode: bulk
    bulk:
      index: "mwcli-logs-%Y.%m.%d"
    id_key: event_id
    request_retry_partial: true
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
