# Optional log browsing stack. No application service depends on these containers.
services:
  logs-opensearch:
    image: "${LOGS_OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.4}"
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=${LOGS_OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - logs-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

  logs-collector:
    image: "${LOGS_COLLECTOR_IMAGE:-opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0}"
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=${LOGS_COLLECTOR_JAVA_OPTS:--Xms256m -Xmx256m}
    volumes:
      # Defined by mediawiki/compose.yml, deliberately NOT owned by this stack.
      # Match MediaWiki's override for either a named volume or a host directory.
      - "${MEDIAWIKI_VOLUMES_LOGS:-mediawiki-logs}:/var/log/mediawiki:ro"
      - ./compose/opensearch-dashboards/mount/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./compose/opensearch-dashboards/mount/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./compose/opensearch-dashboards/mount/logstash/template.json:/usr/share/logstash/config/mwcli-template.json:ro
      - logs-collector-data:/usr/share/logstash/data
    depends_on:
      logs-opensearch:
        condition: service_healthy
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

  opensearch-dashboards:
    image: "${OPENSEARCH_DASHBOARDS_IMAGE:-opensearchproject/opensearch-dashboards:2.19.4}"
    restart: unless-stopped
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_NAME=mwcli-logs
      - SERVER_HOST=0.0.0.0
      - SERVER_BASEPATH=/proxy/opensearch-dashboards
      - SERVER_REWRITEBASEPATH=true
      - 'OPENSEARCH_HOSTS=["http://logs-opensearch:9200"]'
      - VIRTUAL_HOST=opensearch-dashboards.local.wmftest.net
      - VIRTUAL_PORT=5601
      - DEFAULT_EXPOSE_PORT=5601
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opensearch-dashboards-host.rule=Host(`opensearch-dashboards.local.wmftest.net`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.opensearch-dashboards-host.entrypoints=web"
      - "traefik.http.routers.opensearch-dashboards-host.service=opensearch-dashboards"
      - "traefik.http.routers.opensearch-dashboards-host.middlewares=opensearch-dashboards-path@docker"
      - "traefik.http.middlewares.opensearch-dashboards-path.redirectregex.regex=^(https?://[^/]+)(/.*)?$$"
      - "traefik.http.middlewares.opensearch-dashboards-path.redirectregex.replacement=$${1}/proxy/opensearch-dashboards$${2}"
      - "traefik.http.routers.opensearch-dashboards-local.rule=Host(`opensearch-dashboards.local.wmftest.net`) && (Path(`/proxy/opensearch-dashboards`) || PathPrefix(`/proxy/opensearch-dashboards/`))"
      - "traefik.http.routers.opensearch-dashboards-local.entrypoints=web"
      - "traefik.http.routers.opensearch-dashboards-local.priority=100"
      - "traefik.http.routers.opensearch-dashboards-local.service=opensearch-dashboards"
      - "traefik.http.routers.opensearch-dashboards.rule=Path(`/proxy/opensearch-dashboards`) || PathPrefix(`/proxy/opensearch-dashboards/`)"
      - "traefik.http.routers.opensearch-dashboards.entrypoints=web"
      - "traefik.http.routers.opensearch-dashboards.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file}"
      - "traefik.http.services.opensearch-dashboards.loadbalancer.server.port=5601"
    depends_on:
      logs-opensearch:
        condition: service_healthy
      traefik:
        condition: service_started
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

# Only the logging stack's private data is deleted by its destroy command.
volumes:
  logs-opensearch-data:
  logs-collector-data:
