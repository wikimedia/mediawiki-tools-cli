services:
  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.statsd-exporter-host.rule=Host(`${STATSD_EXPORTER_VIRTUAL_HOST:-statsd-exporter.local.wmftest.net}`)"
      - "traefik.http.routers.statsd-exporter-host.entrypoints=web"
      - "traefik.http.routers.statsd-exporter-host.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file}"
      - "traefik.http.routers.statsd-exporter-host.service=statsd-exporter"
      - "traefik.http.routers.statsd-exporter.rule=Path(`/proxy/${STATSD_EXPORTER_PROXY_PATH:-statsd-exporter}`) || PathPrefix(`/proxy/${STATSD_EXPORTER_PROXY_PATH:-statsd-exporter}/`)"
      - "traefik.http.routers.statsd-exporter.entrypoints=web"
      - "traefik.http.routers.statsd-exporter.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},strip-statsd-exporter@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-statsd-exporter.stripprefix.prefixes=/proxy/${STATSD_EXPORTER_PROXY_PATH:-statsd-exporter}"
      - "traefik.http.services.statsd-exporter.loadbalancer.server.port=${STATSD_EXPORTER_VIRTUAL_PORT:-9102}"
    ports:
      - "8125:8125/udp"
      - "9102:9102"
    command:
      - "--statsd.listen-udp=:8125"
      - "--web.listen-address=:9102"
    environment:
      - VIRTUAL_HOST=${STATSD_EXPORTER_VIRTUAL_HOST:-statsd-exporter.local.wmftest.net}
      - VIRTUAL_PORT=${STATSD_EXPORTER_VIRTUAL_PORT:-9102}
      - DEFAULT_EXPOSE_PORT=9102
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

  prometheus:
    image: prom/prometheus:v3.9.1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus-host.rule=Host(`${PROMETHEUS_VIRTUAL_HOST:-prometheus.local.wmftest.net}`)"
      - "traefik.http.routers.prometheus-host.entrypoints=web"
      - "traefik.http.routers.prometheus-host.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file}"
      - "traefik.http.routers.prometheus-host.service=prometheus"
      - "traefik.http.routers.prometheus.rule=Path(`/proxy/${PROMETHEUS_PROXY_PATH:-prometheus}`) || PathPrefix(`/proxy/${PROMETHEUS_PROXY_PATH:-prometheus}/`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},strip-prometheus@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-prometheus.stripprefix.prefixes=/proxy/${PROMETHEUS_PROXY_PATH:-prometheus}"
      - "traefik.http.services.prometheus.loadbalancer.server.port=${PROMETHEUS_VIRTUAL_PORT:-9090}"
    volumes:
      - ./compose/prometheus/mount/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - statsd-exporter
    environment:
      - VIRTUAL_HOST=${PROMETHEUS_VIRTUAL_HOST:-prometheus.local.wmftest.net}
      - VIRTUAL_PORT=${PROMETHEUS_VIRTUAL_PORT:-9090}
      - DEFAULT_EXPOSE_PORT=9090
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
