
services:
  keycloak:
    image: "${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:18.0.0}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak-host.rule=Host(`${KEYCLOAK_VIRTUAL_HOST:-keycloak.local.wmftest.net}`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.keycloak-host.entrypoints=web"
      - "traefik.http.routers.keycloak-host.service=keycloak"
      - "traefik.http.routers.keycloak.rule=Path(`/proxy/${KEYCLOAK_PROXY_PATH:-keycloak}`) || PathPrefix(`/proxy/${KEYCLOAK_PROXY_PATH:-keycloak}/`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},strip-keycloak@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-keycloak.stripprefix.prefixes=/proxy/${KEYCLOAK_PROXY_PATH:-keycloak}"
      - "traefik.http.services.keycloak.loadbalancer.server.port=${KEYCLOAK_VIRTUAL_PORT:-8080}"
    security_opt:
      - label:disable
    restart: unless-stopped
    entrypoint: /opt/keycloak/bin/kc.sh start-dev
    volumes:
    - ./compose/keycloak/mount/keycloak:/mwdd:ro
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - VIRTUAL_HOST=${KEYCLOAK_VIRTUAL_HOST:-keycloak.local.wmftest.net}
      - VIRTUAL_PORT=${KEYCLOAK_VIRTUAL_PORT:-8080}
    depends_on:
      - dps
      - traefik
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
