apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090/proxy/$PROMETHEUS_PROXY_PATH
    isDefault: true
    editable: true
    version: 2
  
  - name: Graphite
    type: graphite
    access: proxy
    url: http://graphite:80/proxy/$GRAPHITE_PROXY_PATH
    isDefault: false
    editable: true
    version: 2
  
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686/proxy/$JAEGER_PROXY_PATH
    isDefault: false
    editable: true
    version: 2
