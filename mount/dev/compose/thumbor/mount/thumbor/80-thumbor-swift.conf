# Swift storage settings derived from operations/deployment-charts:
# charts/thumbor/templates/_swift.tpl.
import os

RESULT_STORAGE = 'wikimedia_thumbor.result_storage.swift'
SWIFT_HOST = 'http://swift:8080'
SWIFT_API_PATH = '/v1/AUTH_mw'
SWIFT_AUTH_PATH = '/auth/v1.0'
SWIFT_USER = 'mw:thumbor'
SWIFT_PRIVATE_USER = 'mw:thumbor-private'
SWIFT_KEY = os.environ['SWIFT_KEY']
SWIFT_PRIVATE_KEY = os.environ['SWIFT_PRIVATE_KEY']
SWIFT_PRIVATE_SECRET = os.environ['SWIFT_PRIVATE_SECRET']

# Parse these lists here instead of enabling Thumbor's generic environment
# overrides, which must not replace the parsed lists with comma-separated text.
SWIFT_SHARDED_CONTAINERS = [
    name.strip() for name in os.environ.get('SWIFT_SHARDED_CONTAINERS', '').split(',')
    if name.strip()
]
SWIFT_PRIVATE_CONTAINERS = [
    name.strip() for name in os.environ.get('SWIFT_PRIVATE_CONTAINERS', '').split(',')
    if name.strip()
]
for wiki in os.environ.get('MEDIAWIKI_SWIFT_PRIVATE_WIKIS', '').split(','):
    wiki = wiki.strip()
    if not wiki:
        continue
    for zone in ('public', 'thumb', 'temp', 'transcoded'):
        container = 'wikipedia-{}-local-{}'.format(wiki, zone)
        if container not in SWIFT_PRIVATE_CONTAINERS:
            SWIFT_PRIVATE_CONTAINERS.append(container)
SWIFT_CONNECTION_TIMEOUT = 20
SWIFT_RETRIES = 1
