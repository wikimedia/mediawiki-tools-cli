
services:

  dps:
    image: "${DPS_IMAGE:-defreitas/dns-proxy-server:5.9.0}"
    security_opt:
      - label:disable
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      dps:
        ipv4_address: ${NETWORK_SUBNET_PREFIX}.10
    command: "${DPS_BOOTSTRAP_OPTIONS:--XX:MaxHeapSize=50m -XX:MaxNewSize=10m}"

  dashboard:
    image: "${DASHBOARD_IMAGE:-golang:1.23-alpine}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Path(`/proxy/dashboard`) || PathPrefix(`/proxy/dashboard/`)"
      - "traefik.http.routers.dashboard.priority=100"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.middlewares=forwarded-https@file,dashboard-prefix@file"
      - "traefik.http.services.dashboard.loadbalancer.server.port=${DASHBOARD_VIRTUAL_PORT:-8080}"
    security_opt:
      - label:disable
    restart: unless-stopped
    working_dir: /app
    command: ["go", "run", "main.go"]
    environment:
      - VIRTUAL_HOST=${DASHBOARD_VIRTUAL_HOST:-dashboard.local.wmftest.net,dash.local.wmftest.net}
      - VIRTUAL_PORT=${DASHBOARD_VIRTUAL_PORT:-8080}
      - DEFAULT_EXPOSE_PORT=8080
      - PORT=${PORT}
      - DASHBOARD_PORT=8080
      - GRAPHITE_PROXY_PATH=${GRAPHITE_PROXY_PATH:-graphite}
      - JAEGER_PROXY_PATH=${JAEGER_PROXY_PATH:-jaeger}
      - MAILHOG_PROXY_PATH=${MAILHOG_PROXY_PATH:-mailhog}
      - PHPMYADMIN_PROXY_PATH=${PHPMYADMIN_PROXY_PATH:-phpmyadmin}
      - ADMINER_PROXY_PATH=${ADMINER_PROXY_PATH:-adminer}
      - WDQS_UI_PROXY_PATH=${WDQS_UI_PROXY_PATH:-wdqs-ui}
      - KEYCLOAK_PROXY_PATH=${KEYCLOAK_PROXY_PATH:-keycloak}
      - NOVNC_PROXY_PATH=${NOVNC_PROXY_PATH:-novnc}
      - PROMETHEUS_PROXY_PATH=${PROMETHEUS_PROXY_PATH:-prometheus}
      - GRAFANA_PROXY_PATH=${GRAFANA_PROXY_PATH:-grafana}
      - OPENSEARCH_DASHBOARDS_PROXY_PATH=logs
    volumes:
      - ./compose/base/mount/dashboard:/app:ro
      - ./compose/base/mount/ui:/ui:ro
      - ./:/data:ro
    depends_on:
      - dps
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps

networks:
  dps:
    ipam:
      config:
        # TODO this probably wants to be configurable? or more random? as conflicts can happen in the docker network
        - subnet: ${NETWORK_SUBNET_PREFIX}.0/24
          ip_range: ${NETWORK_SUBNET_PREFIX}.128/25
