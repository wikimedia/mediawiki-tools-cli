
services:
  phpmyadmin:
    image: "${PHPMYADMIN_IMAGE:-phpmyadmin/phpmyadmin:5}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin-host.rule=Host(`${PHPMYADMIN_VIRTUAL_HOST:-phpmyadmin.local.wmftest.net}`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.phpmyadmin-host.entrypoints=web"
      - "traefik.http.routers.phpmyadmin-host.service=phpmyadmin"
      - "traefik.http.routers.phpmyadmin.rule=Path(`/proxy/${PHPMYADMIN_PROXY_PATH:-phpmyadmin}`) || PathPrefix(`/proxy/${PHPMYADMIN_PROXY_PATH:-phpmyadmin}/`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.routers.phpmyadmin.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},strip-phpmyadmin@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-phpmyadmin.stripprefix.prefixes=/proxy/${PHPMYADMIN_PROXY_PATH:-phpmyadmin}"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=${PHPMYADMIN_VIRTUAL_PORT:-80}"
    security_opt:
      - label:disable
    restart: unless-stopped
    environment:
      - PMA_USER=root
      - PMA_PASSWORD=toor
      - PMA_HOSTS=mysql,mysql-replica
      - PMA_ARBITRARY=1
      - VIRTUAL_HOST=${PHPMYADMIN_VIRTUAL_HOST:-phpmyadmin.local.wmftest.net}
      - VIRTUAL_PORT=${PHPMYADMIN_VIRTUAL_PORT:-80}
      - DEFAULT_EXPOSE_PORT=80
    depends_on:
      - dps
      - traefik
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
    volumes:
      - ./compose/phpmyadmin/mount/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
