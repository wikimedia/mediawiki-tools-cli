services:
  cloudflared:
    image: "${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}"
    profiles: ["tunnel"]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:20241
      - --url
      - http://gateway-auth:8080
    depends_on:
      traefik:
        condition: service_started
      gateway-auth:
        condition: service_healthy
    networks:
      - dps
      - gateway-access
