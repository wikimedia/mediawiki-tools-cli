services:
  cloudflared:
    image: "${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}"
    profiles: ["tunnel"]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:20241
      - --url
      - http://traefik:${PORT}
    depends_on:
      - traefik
    networks:
      - dps
