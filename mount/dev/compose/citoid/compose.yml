services:
  citoid:
    # Using this specific has because i found it at https://gitlab.com/wmde/technical-wishes/docker-dev/-/merge_requests/138/diffs
    image: "${CITOID_IMAGE:-docker-registry.wikimedia.org/wikimedia/mediawiki-services-citoid:fcc15c59d18eccc9a0d04f88be64975804233608}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.citoid-host.rule=Host(`${CITOID_VIRTUAL_HOST:-citoid.local.wmftest.net}`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.citoid-host.entrypoints=web"
      - "traefik.http.routers.citoid-host.service=citoid"
      - "traefik.http.routers.citoid.rule=Path(`/proxy/${CITOID_PROXY_PATH:-citoid}`) || PathPrefix(`/proxy/${CITOID_PROXY_PATH:-citoid}/`)"
      - "traefik.http.routers.citoid.entrypoints=web"
      - "traefik.http.routers.citoid.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file},strip-citoid@docker,forwarded-https@file"
      - "traefik.http.middlewares.strip-citoid.stripprefix.prefixes=/proxy/${CITOID_PROXY_PATH:-citoid}"
      - "traefik.http.services.citoid.loadbalancer.server.port=${CITOID_VIRTUAL_PORT:-1970}"
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${CITOID_VIRTUAL_HOST:-citoid.local.wmftest.net}
      - VIRTUAL_PORT=${CITOID_VIRTUAL_PORT:-1970}
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
