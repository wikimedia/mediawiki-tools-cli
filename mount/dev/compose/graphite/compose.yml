
services:
  graphite:
    image: "${GRAPHITE_IMAGE:-graphiteapp/graphite-statsd:1.1.10-4}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphite-host.rule=Host(`${GRAPHITE_VIRTUAL_HOST:-graphite.local.wmftest.net}`) && !PathPrefix(`/proxy/`)"
      - "traefik.http.routers.graphite-host.entrypoints=web"
      - "traefik.http.routers.graphite-host.service=graphite"
      - "traefik.http.routers.graphite-host.middlewares=local-graphite-path@docker"
      - "traefik.http.middlewares.local-graphite-path.redirectregex.regex=^(https?://[^/]+)(/.*)?$$"
      - "traefik.http.middlewares.local-graphite-path.redirectregex.replacement=$${1}/proxy/${GRAPHITE_PROXY_PATH:-graphite}$${2}"
      - "traefik.http.routers.graphite-local-path.rule=Host(`${GRAPHITE_VIRTUAL_HOST:-graphite.local.wmftest.net}`) && (Path(`/proxy/${GRAPHITE_PROXY_PATH:-graphite}`) || PathPrefix(`/proxy/${GRAPHITE_PROXY_PATH:-graphite}/`))"
      - "traefik.http.routers.graphite-local-path.entrypoints=web"
      - "traefik.http.routers.graphite-local-path.priority=100"
      - "traefik.http.routers.graphite-local-path.service=graphite"
      - "traefik.http.routers.graphite.rule=Path(`/proxy/${GRAPHITE_PROXY_PATH:-graphite}`) || PathPrefix(`/proxy/${GRAPHITE_PROXY_PATH:-graphite}/`)"
      - "traefik.http.routers.graphite.entrypoints=web"
      - "traefik.http.routers.graphite.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:-gateway-auth@file}"
      - "traefik.http.services.graphite.loadbalancer.server.port=${GRAPHITE_VIRTUAL_PORT:-80}"
    security_opt:
      - label:disable
    restart: unless-stopped
    environment:
      - GRAPHITE_URL_ROOT=/proxy/${GRAPHITE_PROXY_PATH:-graphite}
      - VIRTUAL_HOST=${GRAPHITE_VIRTUAL_HOST:-graphite.local.wmftest.net}
      - VIRTUAL_PORT=${GRAPHITE_VIRTUAL_PORT:-80}
    depends_on:
      - traefik
    dns:
      - ${NETWORK_SUBNET_PREFIX}.10
    networks:
      - dps
    volumes:
      - graphite-storage:/opt/graphite/storage
      - graphite-logs:/var/log

volumes:
  graphite-storage:
  graphite-logs:
