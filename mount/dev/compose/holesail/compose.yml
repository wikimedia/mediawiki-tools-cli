services:
  holesail:
    image: "${HOLESAIL_IMAGE:-mwcli-holesail:2.4.4}"
    build: ./compose/holesail
    profiles:
      - gateway
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--live", "8080", "--host", "gateway-auth"]
    depends_on:
      traefik:
        condition: service_started
      gateway-auth:
        condition: service_healthy
    networks:
      - dps
      - gateway-access
